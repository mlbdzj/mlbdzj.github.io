<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>文章 · mlbdzj 的博客</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="site-header">
        <a class="brand" href="index.html">mlbdzj</a>
        <nav>
            <a href="index.html#about">简介</a>
            <a href="index.html#posts">文章</a>
            <a href="index.html#links">链接</a>
        </nav>
    </header>

    <main class="article">
        <p class="back"><a href="index.html#posts">&larr; 返回文章列表</a></p>
        <div class="article-body" id="content">
            <p>加载中…</p>
        </div>
    </main>

    <footer>
        <p>© <span id="year">2026</span> mlbdzj · 建站于 2026 · 由 GitHub Pages 托管</p>
    </footer>

    <script src="assets/marked.min.js"></script>
    <script>
        // 用法：post.html?file=文件名（posts 目录下的 .md 文件，不带扩展名）
        var file = new URLSearchParams(location.search).get('file');
        if (!/^[\w.-]+$/.test(file)) {
            document.getElementById('content').innerHTML = '<p>缺少文件名，请在链接中使用 post.html?file=xxx。</p>';
        } else {
            fetch('posts/' + file + '.md')
                .then(function (res) {
                    if (!res.ok) throw new Error();
                    return res.text();
                })
                .then(function (text) {
                    render(text);
                })
                .catch(function () {
                    document.getElementById('content').innerHTML =
                        '<p>没有找到文章 <code>' + file + '.md</code>，请检查文件名。</p>';
                });
        }

        function render(text) {
            // 解析可选的 front-matter：title / date
            var meta = { title: '', date: '' };
            var rest = text;
            if (text.startsWith('---\n')) {
                var end = text.indexOf('\n---', 4);
                if (end > -1) {
                    text.slice(4, end).split('\n').forEach(function (line) {
                        var i = line.indexOf(':');
                        if (i > -1) {
                            meta[line.slice(0, i).trim()] = line.slice(i + 1).trim();
                        }
                    });
                    rest = text.slice(end + 4);
                }
            }
            // 没有 front-matter 时，取正文第一个 # 标题作为文章标题
            if (!meta.title) {
                var m = rest.match(/^#\s+(.+)\n?/);
                if (m) {
                    meta.title = m[1];
                    rest = rest.replace(m[0], '');
                }
            }
            document.title = (meta.title || '文章') + ' · mlbdzj 的博客';
            var html = '<h1>' + meta.title + '</h1>';
            if (meta.date) html += '<p class="post-meta">' + meta.date + '</p>';
            document.getElementById('content').innerHTML = html + marked.parse(rest);
        }
    </script>
</body>
</html>
