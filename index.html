<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>mlbdzj 的博客</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="site-header">
        <a class="brand" href="index.html">mlbdzj</a>
        <nav>
            <a href="#about">简介</a>
            <a href="#posts">文章</a>
            <a href="#links">链接</a>
        </nav>
    </header>

    <main>
        <section id="about" class="about">
            <div class="avatar" aria-hidden="true">m</div>
            <h1>mlbdzj</h1>
            <p class="tagline">用文字记录学习与生活的工程师。</p>
        </section>

        <section id="posts">
            <h2>最近文章</h2>
            <ul class="post-list" id="post-list">
                <li class="loading">加载中…</li>
            </ul>
        </section>

        <section id="links">
            <h2>链接</h2>
            <ul class="link-list">
                <li><a href="https://github.com/mlbdzj">GitHub</a></li>
                <li><a href="mailto:yourname@example.com">邮箱</a></li>
            </ul>
        </section>
    </main>

    <footer>
        <p>© <span id="year">2026</span> mlbdzj · 建站于 2026 · 由 GitHub Pages 托管</p>
    </footer>

    <script>
        document.getElementById('year').textContent = new Date().getFullYear();
    </script>
    <script>
        (function () {
            var ul = document.getElementById('post-list');
            var repo = 'mlbdzj/mlbdzj.github.io';
            var cacheKey = 'posts-cache';
            var ttl = 10 * 60 * 1000;
            var cache = null;
            try { cache = JSON.parse(localStorage.getItem(cacheKey)); } catch (e) {}

            function stem(name) { return name.replace(/\.md$/, ''); }

            function render(items) {
                if (!items.length) {
                    ul.innerHTML = '<li class="loading">还没有文章</li>';
                    return;
                }
                ul.innerHTML = items.map(function (it) {
                    return '<li><a href="post.html?file=' + stem(it.file) + '">' + it.title +
                        '</a><span class="post-date">' + (it.date || '') + '</span></li>';
                }).join('');
            }

            function parseMeta(text) {
                var meta = { title: '', date: '' };
                if (text.indexOf('---') === 0) {
                    var end = text.indexOf('\n---', 4);
                    if (end > -1) {
                        text.slice(4, end).split('\n').forEach(function (line) {
                            var i = line.indexOf(':');
                            if (i > -1) {
                                meta[line.slice(0, i).trim()] = line.slice(i + 1).trim();
                            }
                        });
                    }
                }
                return meta;
            }

            function readMeta(name) {
                return fetch('posts/' + name).then(function (r) {
                    return r.ok ? r.text() : '';
                }).then(function (text) {
                    var m = parseMeta(text);
                    return { file: name, title: m.title || stem(name), date: m.date };
                });
            }

            function listFromApi() {
                return fetch('https://api.github.com/repos/' + repo + '/contents/posts')
                    .then(function (r) {
                        if (!r.ok) throw new Error('api');
                        return r.json();
                    })
                    .then(function (files) {
                        return files.filter(function (f) {
                            return /\.md$/.test(f.name) && f.name.charAt(0) !== '_';
                        }).map(function (f) { return f.name; });
                    });
            }

            function withMeta(names) {
                return Promise.all(names.map(readMeta)).then(function (items) {
                    items.sort(function (a, b) { return (b.date || '').localeCompare(a.date || ''); });
                    return items;
                });
            }

            if (cache && Date.now() - cache.at < ttl) {
                render(cache.items);
            } else {
                if (cache) {
                    render(cache.items);
                } else {
                    ul.innerHTML = '<li class="loading">加载中…</li>';
                }
                listFromApi().then(withMeta).then(function (items) {
                    render(items);
                    try { localStorage.setItem(cacheKey, JSON.stringify({ at: Date.now(), items: items })); } catch (e) {}
                }).catch(function () {
                    if (!cache) {
                        ul.innerHTML = '<li class="loading">文章列表加载失败，请刷新重试。</li>';
                    }
                });
            }
        })();
    </script>
</body>
</html>
