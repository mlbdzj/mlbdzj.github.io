<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>mlbdzj 的博客</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="site-header">
        <a class="brand" href="index.html">mlbdzj</a>
        <nav>
            <a href="#about">简介</a>
            <a href="#posts">文章</a>
            <a href="#links">链接</a>
        </nav>
    </header>

    <main>
        <section id="about" class="about">
            <div class="avatar" aria-hidden="true">m</div>
            <h1>mlbdzj</h1>
            <p class="tagline">用文字记录学习与生活的工程师。</p>
        </section>

        <section id="posts">
            <h2>最近文章</h2>
            <ul class="post-list" id="post-list">
                <li class="loading">加载中…</li>
            </ul>
        </section>

        <section id="links">
            <h2>链接</h2>
            <ul class="link-list">
                <li><a href="https://github.com/mlbdzj">GitHub</a></li>
                <li><a href="mailto:yourname@example.com">邮箱</a></li>
            </ul>
        </section>
    </main>

    <footer>
        <p>© <span id="year">2026</span> mlbdzj · 建站于 2026 · 由 GitHub Pages 托管</p>
    </footer>

    <script>
        document.getElementById('year').textContent = new Date().getFullYear();
    </script>
    <script>
        (function () {
            var ul = document.getElementById('post-list');

            function esc(s) {
                return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
            }

            function render(items) {
                if (!items.length) {
                    ul.innerHTML = '<li class="loading">还没有文章</li>';
                    return;
                }
                ul.innerHTML = items.map(function (it) {
                    return '<li><a href="post.html?file=' + esc(it.file) + '">' + esc(it.title) +
                        '</a><span class="post-date">' + esc(it.date || '') + '</span></li>';
                }).join('');
            }

            fetch('posts/index.json').then(function (r) {
                if (!r.ok) throw new Error();
                return r.json();
            }).then(function (data) {
                render(data.items || []);
            }).catch(function () {
                ul.innerHTML = '<li class="loading">文章列表加载失败，请刷新重试。</li>';
            });
        })();
    </script>
</body>
</html>
